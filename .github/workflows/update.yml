name: Son24 içerik güncelleme

# Private repo → GitHub Actions free tier is 2000 min/month. Running every 2
# hours (12 runs/day) keeps us comfortably under it (~1800 min/month at ~5
# min/run). Each run only summarises NEW events, so Gemini quota is spent on
# real new stories. Importance ranking decides which reach the 20 cards.
#
# Want fresher updates? Make the repo Public (unlimited free Actions) and
# change the cron to '*/30 * * * *' for every-30-minutes.
on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours, on the hour
  workflow_dispatch: {}     # allow manual "Run workflow" from the Actions tab

# Don't stack runs: if one is still going, skip the next tick.
concurrency:
  group: son24-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run pipeline
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/pipeline.mjs
