name: Son24 içerik güncelleme

# Public repo → GitHub Actions minutes are unlimited, so we run every 30 min
# for fast breaking-news coverage. Each run only summarises NEW events, so
# Gemini quota is spent on real new stories. Importance ranking decides which
# reach the 20 cards.
#
# NOTE (pre-publish): 30 min is still a dev cadence. Before launch, move to
# near-realtime ingestion so son dakika lands instantly (see project memory).
on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch: {}      # allow manual "Run workflow" from the Actions tab

# Don't stack runs: if one is still going, skip the next tick.
concurrency:
  group: son24-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run pipeline
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/pipeline.mjs
